name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4 # تم التحديث للنسخة 4 لدعم Node 24
        with:
          gradle-version: 8.5 # حددنا النسخة 8.5 وهي الأكثر استقراراً الآن

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Arish-Eggs-App
          path: app/build/outputs/apk/debug/*.apk
