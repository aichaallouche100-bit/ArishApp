name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Build APK with Auto-Version
        # الحل الجذري: سطر بناء يرسل رقم المحاولة كإصدار للتطبيق
        run: gradle assembleDebug -PautoVersionCode=${{ github.run_number }} -PautoVersionName="5.2.${{ github.run_number }}"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Arish-Eggs-App
          path: app/build/outputs/apk/debug/*.apk
